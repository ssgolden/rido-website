name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          # The eslint react-hooks rules are memory-hungry on this codebase
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build
        run: npm run build

  export:
    name: Static Export Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_OUTPUT: export
          CUSTOM_DOMAIN: true
