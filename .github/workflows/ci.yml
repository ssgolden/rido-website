name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          # The eslint react-hooks rules are memory-hungry on this codebase
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Function tests (waitlist, events)
        run: npm test

      - name: Build
        run: npm run build

  export:
    name: Static Export Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The export build also fails if an unannounced town reaches out/
      # (scripts/check-town-leak.mjs, run by scripts/build.mjs).
      - name: Build static export
        run: npm run build
        env:
          NEXT_OUTPUT: export
          CUSTOM_DOMAIN: true

  quality:
    name: Quality Gates (Lighthouse + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static export build
        run: npm run build
        env:
          NEXT_OUTPUT: export
          CUSTOM_DOMAIN: true

      # GitHub's runners score about 10 points below a fast local machine, so
      # the performance floors here are calibrated to the runner (desktop 85,
      # mobile 70). LCP and CLS budgets are absolute and block as set.
      - name: Lighthouse budgets (desktop)
        run: npx lhci autorun --config=lighthouserc.json

      # Mobile uses Lighthouse's simulated slow 4G + 4x CPU. CLS and the
      # performance floor block; LCP < 2.5s is a warning until the homepage
      # ships less JavaScript.
      - name: Lighthouse budgets (mobile)
        run: npx lhci autorun --config=lighthouserc.mobile.json

      - name: Accessibility (axe) and visual QA gates
        # Against the static export, served like Netlify serves www.rido.bike
        # (pretty URLs, real 404, every header from public/_headers including
        # the CSP). One step so both run against the same server. Visual QA
        # screenshots every key page at phone/tablet/desktop and fails on any
        # page error (e.g. a hydration mismatch) or CSP violation, with motion
        # on or off. QA_STATIC skips the server-only /coming-soon page.
        env:
          QA_STATIC: "1"
        run: |
          node scripts/serve-export.mjs 3000 out &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3000/ || { echo "server did not start"; exit 1; }
          node scripts/a11y-audit.mjs http://localhost:3000
          node scripts/visual-qa.mjs http://localhost:3000 visual-qa

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: visual-qa/
          if-no-files-found: ignore
          retention-days: 14
