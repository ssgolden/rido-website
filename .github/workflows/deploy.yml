name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Gate: a direct push to master must pass the same fast checks as a PR
      # before anything is published. The export build below also fails if an
      # unannounced town would ship (scripts/check-town-leak.mjs).
      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Function tests (waitlist, events)
        run: npm test

      - name: Build for GitHub Pages
        run: npm run build
        env:
          NEXT_OUTPUT: export
          CUSTOM_DOMAIN: true

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Copy 404 page
        run: cp out/_not-found.html out/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4