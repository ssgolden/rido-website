name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: Build for GitHub Pages (default, backward compatible)
  # ============================================================
  build-github-pages:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref_name == 'master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_OUTPUT: export

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Copy 404 page
        run: cp out/_not-found.html out/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # ============================================================
  # Job 2: Build for Custom Domain (rido.bike)
  # ============================================================
  build-custom-domain:
    name: Build for rido.bike
    runs-on: ubuntu-latest
    if: github.ref_name == 'master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for custom domain
        run: npm run build
        env:
          NEXT_OUTPUT: export
          CUSTOM_DOMAIN: "true"

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Copy 404 page
        run: cp out/_not-found.html out/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # ============================================================
  # Job 3: Deploy to GitHub Pages
  # ============================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-github-pages, build-custom-domain]
    if: github.ref_name == 'master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================================
  # Job 4: Sync to Vercel (for custom domain rido.bike)
  # ============================================================
  deploy-vercel:
    name: Deploy to Vercel (rido.bike)
    runs-on: ubuntu-latest
    if: github.ref_name == 'master'
    environment:
      name: Production
      url: https://rido.bike
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel (custom domain)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_OUTPUT: export
          CUSTOM_DOMAIN: "true"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}